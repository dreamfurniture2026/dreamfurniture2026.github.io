const FQ=[["هل التوصيل والتركيب مجاني؟","Is delivery and installation free?","الشحن مجاني داخل القاهرة والجيزة للطلبات من 10,000 جنيه فأكثر. التركيب خدمة إضافية بتتأكد معاك.","Shipping is free in Cairo & Giza for orders of 10,000 EGP and above. Installation is an add-on we confirm with you."],["هل يمكن التقسيط؟","Can I pay in instalments?","نعم، تقسيط حتى 12 شهر للشركات والأفراد، والشروط بتتأكد وقت الطلب.","Yes, up to 12 months for companies and individuals; terms are confirmed at order time."],["هل تصممون حسب الهوية البصرية؟","Do you customise to brand identity?","نعم، نخصص الألوان والخامات والشعار للعلامات الكبرى والمصانع.","Yes, we customise colours, materials and logos for big brands and factories."],["ما مدة الضمان؟","How long is the warranty?","ضمان 5 سنوات مع صيانة وقطع غيار أصلية.","5-year warranty with maintenance and original spare parts."],["هل يمكن إرجاع المنتج؟","Can I return a product?","نعم، خلال 14 يوماً بحالته الأصلية، ونرتب الاستلام من بابك.","Yes, within 14 days in original condition, and we arrange pickup."],["هل يوجد خصم للكميات؟","Is there a bulk discount?","نعم: 10+ خصم 10%، و50+ خصم 18%، و100+ خصم 25%.","Yes: 10+ gets 10% off, 50+ gets 18% off, 100+ gets 25% off."]];
